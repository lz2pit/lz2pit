<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астрологичен Софтуер</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Астрологичен Софтуер</h1>

        <div class="form-section">
            <h2>Данни за раждане</h2>
            <form id="birth-form">
                <div class="form-group">
                    <label for="name">Име:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="gender">Пол:</label>
                    <select id="gender" name="gender" required>
                        <option value="Мъж">Мъж</option>
                        <option value="Жена">Жена</option>
                    </select>
                </div>
                <div class="form-group date-time-group">
                    <label for="year">Година:</label>
                    <input type="number" id="year" name="year" min="1900" max="2100" required>
                    <label for="month">Месец:</label>
                    <select id="month" name="month" required>
                        <option value="1">Януари</option>
                        <option value="2">Февруари</option>
                        <option value="3">Март</option>
                        <option value="4">Април</option>
                        <option value="5">Май</option>
                        <option value="6">Юни</option>
                        <option value="7">Юли</option>
                        <option value="8">Август</option>
                        <option value="9">Септември</option>
                        <option value="10">Октомври</option>
                        <option value="11">Ноември</option>
                        <option value="12">Декември</option>
                    </select>
                    <label for="day">Ден:</label>
                    <input type="number" id="day" name="day" min="1" max="31" required>
                </div>
                <div class="form-group date-time-group">
                    <label for="hour">Час:</label>
                    <input type="number" id="hour" name="hour" min="0" max="23" required>
                    <label for="minute">Минути:</label>
                    <input type="number" id="minute" name="minute" min="0" max="59" required>
                    <label for="second">Секунди:</label>
                    <input type="number" id="second" name="second" min="0" max="59" value="0">
                </div>
                <div class="form-group">
                    <label for="city">Град:</label>
                    <input type="text" id="city" name="city" required>
                    <div id="city-suggestions" class="suggestions"></div>
                </div>
                <div class="form-group">
                    <label for="country">Държава:</label>
                    <input type="text" id="country" name="country" required>
                    <div id="country-suggestions" class="suggestions"></div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-calculator"></i> Изчисли Натална Карта</button>
            </form>
        </div>

        <div class="results-section" id="results-section">
            <h2>Резултати</h2>
            <div class="natal-chart-container">
                <h3>Натална Карта</h3>
                <div id="natal-chart"></div>
            </div>
            <div id="aspects-table"></div>

            <div class="forecast-section">
                <h2>Прогноза (Транзити )</h2>
                <div class="form-group date-time-group">
                    <label for="start-date">Начална дата:</label>
                    <input type="date" id="start-date" name="start-date" required>
                    <label for="end-date">Крайна дата:</label>
                    <input type="date" id="end-date" name="end-date" required>
                </div>
                <button id="calculate-forecast" class="btn"><i class="fas fa-chart-line"></i> Изчисли Прогноза</button>
                <div id="forecast-table"></div>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
